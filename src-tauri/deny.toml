[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "deny"
# `paste` (macro proc, non maintenu, sans vulnérabilité) est tiré par specta ; à retirer quand specta migre.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
