[package]
name = "vigie"
version = "0.1.0"
description = "Inventaire de sécurité de comptes, local et chiffré"
authors = ["Yassine El Jal"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vigie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
secrecy = "0.10.3"
zeroize = "1.9.1"
rand = "0.10.3"
thiserror = "2.0.21"
zxcvbn = "3.1.1"
data-encoding = "2.11.1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.6.0"
tracing = "0.1.44"
psl = "2.1.245"
csv = "1.4.0"
tauri-plugin-dialog = "2.8.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
